<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百兽列国 v0.3</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🐾 百兽列国</h1>

    <div id="game">

        <!-- 地图 -->
        <div id="mapArea">
            <h2>🌍 灵野大陆</h2>

            <div id="map"></div>
        </div>

        <!-- 国家信息 -->
        <div id="infoArea">
            <h2>🐺 狼国</h2>

            <p>🍖 食物：<span id="food">100</span></p>

            <p>🌿 材料：<span id="wood">80</span></p>

            <p>⭐ 士气：<span id="morale">100</span></p>

            <p>📅 回合：<span id="turn">1</span></p>

            <button id="endTurn">结束回合</button>
        </div>

    </div>

    <!-- 日志 -->
    <div id="log">
        欢迎来到灵野大陆！
    </div>

    <script src="script.js"></script>

</body>

</html>
