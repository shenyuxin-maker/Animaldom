<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animaldom - 百兽列国</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= 主菜单 ================= -->

<div id="menuScreen">

<h1>🐺 Animaldom</h1>

<h2>百兽列国</h2>

<p>一款动物策略游戏</p>

<button id="playBtn">
开始游戏
</button>

</div>

<!-- ================= 国家选择 ================= -->

<div id="countryScreen" style="display:none;">

<h2>请选择国家</h2>

<button onclick="chooseCountry('🐺 狼国')">
🐺 狼国
</button>

<button onclick="chooseCountry('🦊 狐国')">
🦊 狐国
</button>

<button onclick="chooseCountry('🐻 熊国')">
🐻 熊国
</button>

</div>

<!-- ================= 游戏 ================= -->

<div id="gameScreen" style="display:none;">

<h1 id="countryTitle">
🐺 狼国
</h1>

<div id="game">

<div id="mapArea">

<h2>🌍 灵野大陆</h2>

<div id="map"></div>

</div>

<div id="infoArea">

<p>🍖 食物：
<span id="food">100</span>
</p>

<p>🌿 木材：
<span id="wood">80</span>
</p>

<p>⭐ 士气：
<span id="morale">100</span>
</p>

<p>📅 回合：
<span id="turn">1</span>
</p>

<button id="endTurn">
结束回合
</button>

</div>

</div>

<div id="log">
欢迎来到灵野大陆！
</div>

</div>

<script src="script.js"></script>

</body>

</html>
